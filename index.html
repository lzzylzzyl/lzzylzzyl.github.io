</head>
<body>
    <!-- 设置面板 -->
    <background-settings></background-settings>
    <music-player></music-player>
    <x-side-navigator></x-side-navigator>
    <!-- 左侧导航栏 -->
    <nav class="left-nav">
        <h3>分类导航</h3>
        <a href="#music" class="nav-link">音乐欣赏</a>
        <a href="#tech" class="nav-link">科技前沿</a>
        <a href="#literature" class="nav-link">文学天地</a>
        <a href="#art" class="nav-link">艺术长廊</a>
        <a href="#history" class="nav-link">历史回眸</a>
        <a href="#science" class="nav-link">科学探索</a>
    </nav>



    <!-- 粒子效果容器 -->
    <div id="particles-js"></div>

    <!-- 页面内容 -->
    <div class="content-wrapper">
        <header>
            <h1>欢迎来到 Wiki 主页</h1>
            <p>探索知识的海洋，发现无限可能</p>
        </header>

        <nav>
            <a href="index.html">首页</a>
            <a href="about.html">关于我们</a>
            <a href="categories.html">分类</a>
            <a href="help.html">帮助</a>
        </nav>

        <div class="container">
            <div class="main-content">

                <h2>赛博木鱼</h2>
                <ul>

                    <li id="time">当前时间：</li>
                    <!-- 显示当前经验的区域 -->
                    <li id="experience">功德：0</li>
                    <!-- 修改经验的按钮 -->
                    <li onclick="modifyExperience()">功德+10</li>
                </ul>

                <h2>最新文章</h2>
                <ul>
                    <li><a href="#">文章标题 1：如何学习编程</a></li>
                    <li><a href="#">文章标题 2：人工智能的未来</a></li>
                    <li><a href="#">文章标题 3：Web 开发入门指南</a></li>
                    <li><a href="complex.html">实用篇 4：复数计算器</a></li>
                    <li><a href="graph.html">实用篇 5：函数绘图器</a></li>

                </ul>

                    <li><a href="#">科技</a></li>

            </div>
        </div>

    </div>

    <!-- 引入 particles.js 库 -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="scripts.js"></script> <!-- 引入外部 JS 文件 -->
    <script>
        // 显示当前时间的函数
        function displayTime() {
            const now = new Date(); // 获取当前时间
            const timeString = now.toLocaleTimeString(); // 将时间转换为本地时间字符串
            document.getElementById('time').textContent = '当前时间：' + timeString; // 更新页面上的时间显示
        }

        // 修改经验值的函数
        function modifyExperience() {
            const experienceElement = document.getElementById('experience'); // 获取显示经验的元素
            let experience = parseInt(experienceElement.textContent.split('：')[1]); // 从文本中提取当前经验值并转换为整数
            experience += 10; // 每次点击增加10点经验
            experienceElement.textContent = '功德：' + experience; // 更新页面上的经验显示
        }

        // 每秒更新一次时间
        setInterval(displayTime, 1000); // 设置定时器，每秒调用一次displayTime函数
        displayTime(); // 初始化时立即显示时间
    </script>
</body>
